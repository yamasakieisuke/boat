name: Boat Daily Verify

on:
  schedule:
    # 翌日 00:13 JST = 15:13 UTC（夜バッチ：N日夜にその日を verify）。LZH 未公開時は HTML フォールバックで対応
    - cron: '13 15 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '対象日付 YYYYMMDD（空欄=実行時点の昨日 JST。夜バッチで cron 発火時は当日 JST = レース実施日）'
        type: string
        default: ''
      backfill_days:
        description: '過去何日ぶんの verify を作り直すか（0=しない）。結果CSVを直したときの再計算用。既定3日は毎晩自動で走る'
        type: string
        default: ''

permissions:
  actions: read
  contents: write

jobs:
  verify:
    name: 前日 verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve target date
        id: dateres
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ=Asia/Tokyo date -d 'yesterday' +%Y%m%d)
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "対象日付: $DATE"
        env:
          TZ: Asia/Tokyo

      - name: Download predlogs artifact from predict workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE="${{ steps.dateres.outputs.date }}"
          mkdir -p "data/logs/${DATE}"
          # predict.yml の直近 20 件の run から predlogs-{DATE} を探す
          for RUN_ID in $(gh run list --workflow=predict.yml --limit=20 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$RUN_ID" --name "predlogs-${DATE}" --dir "data/logs/${DATE}" 2>/dev/null; then
              echo "predlogs-${DATE} を run ${RUN_ID} から取得"
              ls "data/logs/${DATE}" | head -10
              exit 0
            fi
          done
          echo "::warning::predlogs-${DATE} が直近20件の predict run に見つからず（pred.json なしで verify を試行）"

      - name: Run morning_verify
        run: |
          python3 scripts/morning_verify.py --date "${{ steps.dateres.outputs.date }}"
        env:
          WP_SYNC_URL: ${{ secrets.WP_SYNC_URL }}
          WP_SYNC_TOKEN: ${{ secrets.WP_SYNC_TOKEN }}
          TZ: Asia/Tokyo

      - name: Rebuild player/motor stats (build_stats.py)
        run: |
          python3 scripts/build_stats.py 2>&1 | tail -10
        env:
          TZ: Asia/Tokyo

      # ── 直近N日の verify を作り直す（D-6 / 2026-08-18）──────────────
      # verify_history は「その時点の results_csv」で計算された結果を持つ。
      # 2026-08-16 に会場ズレのバグを直して505日ぶんを再生成したが、
      # 既に記録済みの verify_history は古い（汚染データ由来の）値のままだった。
      #
      # 手で直すと同じことが起きるたびに手作業になるので、**毎晩、直近数日を
      # 作り直す**ことで自動的に追従させる。predlogs artifact の保持は90日
      # （predict.yml）なので、その範囲なら結果CSVを直せば自然に反映される。
      #
      # 結果CSVはリポジトリに入っているので --verify-only で再取得は不要。
      - name: 直近N日の verify を作り直す
        env:
          GH_TOKEN: ${{ github.token }}
          WP_SYNC_URL: ${{ secrets.WP_SYNC_URL }}
          WP_SYNC_TOKEN: ${{ secrets.WP_SYNC_TOKEN }}
          TZ: Asia/Tokyo
        run: |
          DAYS="${{ github.event.inputs.backfill_days }}"
          if [ -z "$DAYS" ]; then DAYS=3; fi
          case "$DAYS" in
            ''|*[!0-9]*) echo "backfill_days='$DAYS' は数値でないのでスキップ"; exit 0 ;;
          esac
          if [ "$DAYS" -eq 0 ]; then echo "backfill_days=0 のためスキップ"; exit 0; fi
          echo "直近 ${DAYS} 日の verify を作り直します"

          # predict.yml の run 一覧は1回だけ取る（毎日ぶん叩かない）
          RUNS=$(gh run list --workflow=predict.yml --limit=60 --json databaseId --jq '.[].databaseId')

          for i in $(seq 1 "$DAYS"); do
            D=$(TZ=Asia/Tokyo date -d "-${i} day" +%Y%m%d)
            if [ ! -f "data/results_csv/${D}.csv" ]; then
              echo "  ${D}: 結果CSVが無いのでスキップ"; continue
            fi
            mkdir -p "data/logs/${D}"
            FOUND=0
            for RUN_ID in $RUNS; do
              if gh run download "$RUN_ID" --name "predlogs-${D}" --dir "data/logs/${D}" 2>/dev/null; then
                FOUND=1; break
              fi
            done
            if [ "$FOUND" -eq 0 ]; then
              echo "  ${D}: predlogs が見つからないのでスキップ（保持期間切れ）"; continue
            fi
            echo "  ${D}: 再verify"
            python3 scripts/morning_verify.py --date "$D" --verify-only 2>&1 | tail -5
          done

      # 週次精度レポート（P0-1）
      # verify_history.json を git に載せているので、--no-refresh で当該週の
      # 日別レコードを合算して集計できる（runner に週全体の pred.json は無い）。
      # 毎日走らせて進行中の週を上書き更新し、日曜の実行がその週の確定版になる。
      - name: Weekly accuracy report
        run: |
          python3 scripts/verify.py --report weekly --no-refresh 2>&1 | tail -30
        env:
          TZ: Asia/Tokyo

      - name: Commit updated stats & results CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/players/ data/motors/ data/results_csv/ 2>/dev/null || true
          # 精度の蓄積（P0-1）。verify_history は以降の全ての検証の土台になる。
          # wordpress/ 配下は deploy-wp.yml が push 契機で heteml へ自動デプロイする。
          git add -f data/logs/verify_history.json 2>/dev/null || true
          git add -f wordpress/boat-forecast-viewer/data/accuracy/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "verify: 統計データ・精度履歴を更新 (${{ steps.dateres.outputs.date }})"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break
              echo "push retry $i"
              sleep 5
            done
          else
            echo "no stats changes"
          fi
