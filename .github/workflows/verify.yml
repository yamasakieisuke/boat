name: Boat Daily Verify

on:
  schedule:
    # 翌日 00:13 JST = 15:13 UTC（夜バッチ：N日夜にその日を verify）。LZH 未公開時は HTML フォールバックで対応
    - cron: '13 15 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '対象日付 YYYYMMDD（空欄=実行時点の昨日 JST。夜バッチで cron 発火時は当日 JST = レース実施日）'
        type: string
        default: ''

permissions:
  actions: read
  contents: write

jobs:
  verify:
    name: 前日 verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve target date
        id: dateres
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(TZ=Asia/Tokyo date -d 'yesterday' +%Y%m%d)
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "対象日付: $DATE"
        env:
          TZ: Asia/Tokyo

      - name: Download predlogs artifact from predict workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE="${{ steps.dateres.outputs.date }}"
          mkdir -p "data/logs/${DATE}"
          # predict.yml の直近 20 件の run から predlogs-{DATE} を探す
          for RUN_ID in $(gh run list --workflow=predict.yml --limit=20 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$RUN_ID" --name "predlogs-${DATE}" --dir "data/logs/${DATE}" 2>/dev/null; then
              echo "predlogs-${DATE} を run ${RUN_ID} から取得"
              ls "data/logs/${DATE}" | head -10
              exit 0
            fi
          done
          echo "::warning::predlogs-${DATE} が直近20件の predict run に見つからず（pred.json なしで verify を試行）"

      - name: Run morning_verify
        run: |
          python3 scripts/morning_verify.py --date "${{ steps.dateres.outputs.date }}"
        env:
          WP_SYNC_URL: ${{ secrets.WP_SYNC_URL }}
          WP_SYNC_TOKEN: ${{ secrets.WP_SYNC_TOKEN }}
          TZ: Asia/Tokyo

      - name: Rebuild player/motor stats (build_stats.py)
        run: |
          python3 scripts/build_stats.py 2>&1 | tail -10
        env:
          TZ: Asia/Tokyo

      - name: Commit updated stats & results CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/players/ data/motors/ data/results_csv/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "verify: 統計データ更新 (${{ steps.dateres.outputs.date }})"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break
              echo "push retry $i"
              sleep 5
            done
          else
            echo "no stats changes"
          fi
