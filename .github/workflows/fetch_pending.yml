name: Boat Fetch Pending (展示/オッズ)

# 展示/オッズの polling 取得。
# - predict.yml の watchlist job が fetch_requests.json を書き出し
# - このワークフローが10分間隔で run_pending.py を実行 → 取得成功 jcd は predictor 再実行で WP 更新
# - 状態（pending_tasks.json + data/raw/{date}/ + data/odds/{date}/）は fetch-state-{date} artifact に保存し次回 poll へ持ち越し

on:
  schedule:
    # JST 10:00-20:55 / 5分間隔（UTC 01:00-11:55）
    # 10分窓に必ず2回入るよう5分間隔。cron遅延（0-3分）でも1回は捕捉できる安全マージン
    - cron: '*/5 1-11 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '対象日付 YYYYMMDD（空欄=実行時点の今日 JST）'
        type: string
        default: ''

permissions:
  contents: write
  actions: write  # self-trigger チェーン用

concurrency:
  group: boat-fetch-pending
  cancel-in-progress: false

jobs:
  fetch:
    name: 展示/オッズ取得
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve target date
        id: dateres
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(date +%Y%m%d)
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "対象日付: $DATE"
        env:
          TZ: Asia/Tokyo

      - name: Restore fetch-state artifact (previous poll)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE="${{ steps.dateres.outputs.date }}"
          mkdir -p data data/raw "data/raw/$DATE" data/odds "data/odds/$DATE"
          RESTORED=0
          # 直近 30 件の fetch_pending run から fetch-state-{DATE} を探す
          for RUN_ID in $(gh run list --workflow=fetch_pending.yml --limit=30 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$RUN_ID" --name "fetch-state-${DATE}" --dir ./_state 2>/dev/null; then
              echo "fetch-state-${DATE} を run ${RUN_ID} から復元"
              # upload-artifact が LCA prefix を strip するため、_state 直下に pending_tasks.json / raw / odds が並ぶ
              cp -R ./_state/. data/ 2>/dev/null || true
              rm -rf ./_state
              echo "復元内容:"
              ls data/raw/$DATE 2>/dev/null | head -10 | sed 's/^/  raw: /'
              ls data/odds/$DATE 2>/dev/null | head -10 | sed 's/^/  odds: /'
              [ -f data/pending_tasks.json ] && echo "  pending_tasks.json: $(jq length data/pending_tasks.json) tasks"
              RESTORED=1
              break
            fi
          done
          if [ $RESTORED -eq 0 ]; then
            echo "（fetch-state なし＝今日の初回 poll か、retention 期限切れ）"
          fi

      - name: Process pending tasks
        id: pending
        env:
          WP_SYNC_URL: ${{ secrets.WP_SYNC_URL }}
          WP_SYNC_TOKEN: ${{ secrets.WP_SYNC_TOKEN }}
          TZ: Asia/Tokyo
        run: |
          # success.tsv は GITHUB_WORKSPACE 内に置く（hashFiles は workspace 外を見ない）
          SUCCESS_FILE="$GITHUB_WORKSPACE/_success.tsv"
          python3 scripts/run_pending.py --quiet --report-success "$SUCCESS_FILE" || true
          if [ -s "$SUCCESS_FILE" ]; then
            echo "成功 (jcd, date):"
            cat "$SUCCESS_FILE"
            echo "has_success=true" >> "$GITHUB_OUTPUT"
          else
            echo "今回の poll で成功タスクなし"
            echo "has_success=false" >> "$GITHUB_OUTPUT"
          fi

      # 福岡オリジナル展示（一周/まわり足/直線）を残す。
      # これを commit しないと、verify の fetch_results.py が join する時点で
      # runner が変わっていて存在せず、results_csv の該当列が永久に空になる。
      # 実際 19,304行すべて空だった原因がこれ。
      - name: 福岡オリジナル展示を commit
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/raw/*/22_R*_original_exhibition.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "raw: 福岡オリジナル展示を保存 (${{ steps.dateres.outputs.date }})"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break
              echo "push retry $i"; sleep 5
            done
          else
            echo "新しいオリジナル展示なし"
          fi

      - name: Re-run prediction & WP publish for successful venues
        if: steps.pending.outputs.has_success == 'true'
        env:
          WP_SYNC_URL: ${{ secrets.WP_SYNC_URL }}
          WP_SYNC_TOKEN: ${{ secrets.WP_SYNC_TOKEN }}
          TZ: Asia/Tokyo
        run: |
          while IFS=$'\t' read -r JCD DATE; do
            [ -z "$JCD" ] && continue
            echo "=== re-predict jcd=$JCD date=$DATE ==="
            python3 scripts/run_morning.py --jcd "$JCD" --skip-verify --date "$DATE" || echo "[WARN] predict失敗 jcd=$JCD"
          done < "$GITHUB_WORKSPACE/_success.tsv"

      - name: Upload fetch-state artifact (for next poll)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-state-${{ steps.dateres.outputs.date }}
          path: |
            data/pending_tasks.json
            data/raw/${{ steps.dateres.outputs.date }}/
            data/odds/${{ steps.dateres.outputs.date }}/
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore

      # GHA schedule cron は高負荷時に容赦なくスキップされるため
      # 自身を chain trigger することで5分間隔の連続実行を保証する。
      # JST 10:00-20:59 の窓内なら sleep 後に次回をキック → 21時以降は自然停止。
      # gh API 一時障害に備えて 3 回 retry。それでも失敗時は watchdog.yml が復活させる。
      - name: Self-trigger next poll (chain)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HOUR=$(TZ=Asia/Tokyo date +%-H)
          if [ "$HOUR" -lt 10 ] || [ "$HOUR" -gt 20 ]; then
            echo "JST ${HOUR}時：active window 外（10-20）→ chain 停止。翌日 cron に委ねる"
            exit 0
          fi
          echo "JST ${HOUR}時：active window 内 → 4分半後に次回 poll を chain trigger"
          sleep 270
          for i in 1 2 3; do
            if gh workflow run fetch_pending.yml -f date="${{ steps.dateres.outputs.date }}"; then
              echo "✅ 次回 poll を trigger（試行 $i）"
              exit 0
            fi
            BACKOFF=$((i * 10))
            echo "[WARN] gh workflow run 失敗（試行 $i/3）→ ${BACKOFF}秒待機して retry"
            sleep $BACKOFF
          done
          echo "[ERROR] 3 回 retry も失敗 → watchdog の復活 trigger に委ねる（本体処理は成功なので exit 0）"
