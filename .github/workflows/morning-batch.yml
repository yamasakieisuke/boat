name: Boat Morning Batch

on:
  schedule:
    # 08:00 JST = 23:00 UTC (前日)
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      skip_verify:
        description: '前日 verify をスキップ'
        type: boolean
        default: false
      jcd:
        description: '特定会場のみ処理（例: 22）空欄=全会場'
        type: string
        default: ''
      date:
        description: '処理対象日付 YYYYMMDD（空欄=今日）'
        type: string
        default: ''

jobs:
  morning-batch:
    name: 朝バッチ実行
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 前日 verify のために data/logs を前回実行分から復元
      - name: Restore data/logs cache
        uses: actions/cache/restore@v4
        with:
          path: data/logs
          key: data-logs-${{ github.run_id }}
          restore-keys: |
            data-logs-

      - name: Run morning batch
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.skip_verify }}" = "true" ]; then
            ARGS="$ARGS --skip-verify"
          fi
          if [ -n "${{ github.event.inputs.jcd }}" ]; then
            ARGS="$ARGS --jcd ${{ github.event.inputs.jcd }}"
          fi
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          echo "実行コマンド: python3 scripts/run_morning.py $ARGS"
          python3 scripts/run_morning.py $ARGS
        env:
          WP_SYNC_URL: ${{ secrets.WP_SYNC_URL }}
          WP_SYNC_TOKEN: ${{ secrets.WP_SYNC_TOKEN }}
          TZ: Asia/Tokyo

      # 次回の verify 用に data/logs を保存（失敗時も保存）
      - name: Save data/logs cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/logs
          key: data-logs-${{ github.run_id }}
