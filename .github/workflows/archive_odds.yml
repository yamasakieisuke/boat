name: Boat Archive Odds

# その日の全レースの3連単オッズを保存する。
#
# 目的: 分析で「公開データで観測できることは全部オッズに織り込まれている」ことが
# 繰り返し確認された（会場特性は 1コース1着率と回収率の相関が +0.02、頭の入れ替えは
# 1号艇頭77.8% vs 2号艇頭78.0%）。市場の値付けを持たない限り「どこで市場が
# 間違えているか」は探せない。その土台を作るのがこのワークフロー。
#
# タイミング: オッズページは当日〜数日しか遡れない（実測: 前日は取得可、7日前は不可）。
# 一方で発走後のオッズは確定値なので、全レース終了後にまとめて取ればよい。
# 最も遅い会場でも発走は20:50頃なので 21:30 JST に実行する。

on:
  schedule:
    # 21:30 JST = 12:30 UTC（全レース終了後）
    - cron: '30 12 * * *'
    # 取りこぼし回収（取得済みはスキップされる）。GitHub の cron は遅延・欠落が
    # 起きうるため複数枠を用意する。実際 2026-08-20〜22 は発火せず3日分を失った。
    - cron: '40 14 * * *'
    - cron: '10 17 * * *'
    - cron: '20 22 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '対象日付 YYYYMMDD（空欄=実行時点の今日 JST）'
        type: string
        default: ''
      sleep:
        description: '1リクエストごとの待機秒（既定1.5）'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: boat-archive-odds
  cancel-in-progress: false

jobs:
  archive:
    name: オッズ保存
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: オッズ取得
        env:
          TZ: Asia/Tokyo
        run: |
          SLEEP="${{ github.event.inputs.sleep }}"
          if [ -z "$SLEEP" ]; then SLEEP=1.5; fi
          DATE="${{ github.event.inputs.date }}"
          if [ -n "$DATE" ]; then
            python3 scripts/archive_odds.py --date "$DATE" --sleep "$SLEEP" || true
            exit 0
          fi
          # 当日ぶん
          python3 scripts/archive_odds.py --sleep "$SLEEP" || true
          # 前日ぶんも取りに行く。オッズページは当日〜翌日までは生きているため、
          # 実行が1回落ちても翌日の実行で回収できる（取得済みはスキップされる）。
          # 2026-08-20〜22 に実行が飛んで3日分を失った実績があるので冗長化する。
          YDAY=$(TZ=Asia/Tokyo date -d 'yesterday' +%Y%m%d)
          python3 scripts/archive_odds.py --date "$YDAY" --sleep "$SLEEP" || true

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/odds_archive/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "odds: オッズ保存 ($(TZ=Asia/Tokyo date +%Y%m%d))"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break
              echo "push retry $i"
              sleep 5
            done
          else
            echo "no odds changes"
          fi
