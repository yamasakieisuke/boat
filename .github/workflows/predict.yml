name: Boat Daily Predict

on:
  schedule:
    # 08:00 JST = 23:00 UTC (前日)
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      jcd:
        description: '特定会場のみ処理（例: 22）空欄=全会場'
        type: string
        default: ''
      date:
        description: '処理対象日付 YYYYMMDD（空欄=今日）'
        type: string
        default: ''

jobs:
  prep:
    name: 会場選定
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      venues: ${{ steps.list.outputs.venues }}
      target_date: ${{ steps.list.outputs.target_date }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: STEP 1-2 list venues
        id: list
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then
            DATE=$(date +%Y%m%d)
          fi
          echo "target_date=$DATE" >> "$GITHUB_OUTPUT"

          if [ -n "${{ github.event.inputs.jcd }}" ]; then
            VENUES="[\"${{ github.event.inputs.jcd }}\"]"
          else
            VENUES=$(python3 scripts/run_morning.py --list-venues --date "$DATE")
          fi
          echo "venues=$VENUES" >> "$GITHUB_OUTPUT"
          echo "対象日付: $DATE / 対象会場: $VENUES"
        env:
          TZ: Asia/Tokyo

  predict:
    name: 予測 jcd=${{ matrix.jcd }}
    needs: prep
    if: needs.prep.outputs.venues != '[]' && needs.prep.outputs.venues != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        jcd: ${{ fromJson(needs.prep.outputs.venues) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: STEP 3-5 predict ${{ matrix.jcd }}
        run: |
          python3 scripts/run_morning.py \
            --jcd "${{ matrix.jcd }}" \
            --skip-verify \
            --date "${{ needs.prep.outputs.target_date }}"
        env:
          WP_SYNC_URL: ${{ secrets.WP_SYNC_URL }}
          WP_SYNC_TOKEN: ${{ secrets.WP_SYNC_TOKEN }}
          TZ: Asia/Tokyo
